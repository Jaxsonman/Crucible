# USD per million tokens. cache_write is the 1-hour cache write price (2x input): Claude Code
# headless writes 1h cache entries (verified against total_cost_usd in the first real run).
# Prices: https://platform.claude.com/docs/en/about-claude/pricing (model pricing table;
# docs.claude.com/en/docs/about-claude/pricing redirects there).
# Efforts: https://code.claude.com/docs/en/model-config (effort levels table).
# Editing a price re-prices all history in reports; never edit results/.
models:
  claude-opus-5-5:
    aliases: [opus]
    efforts: [low, medium, high, xhigh, max]
    input: 4.00
    output: 20.00
    cache_write: 8.00
    cache_read: 0.20
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    as_of: "2026-10-01"
  claude-sonnet-5-5:
    aliases: [sonnet]
    efforts: [low, medium, high, xhigh, max]
    input: 2.00
    output: 10.00
    cache_write: 4.00
    cache_read: 0.20
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    as_of: "2026-10-01"
  claude-haiku-4-5-20251001:
    aliases: [haiku]
    # Haiku 4.5 is absent from the official effort-levels table
    # (https://code.claude.com/docs/en/model-config) and the claude-api reference states the
    # effort parameter errors on Haiku 4.5, so no effort level is declared as supported.
    efforts: []
    input: 1.00
    output: 5.00
    cache_write: 2.00
    cache_read: 0.10
    source_url: https://platform.claude.com/docs/en/about-claude/pricing
    as_of: "2026-10-01"
