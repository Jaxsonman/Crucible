name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Set git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  # Single stable status check for branch protection: require `ci`.
  ci:
    name: ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the test matrix did not succeed
        run: test "${{ needs.test.result }}" = "success"
