[project]
name = "crucible"
version = "0.1.0"
description = "Benchmark Claude model/effort configurations on your own tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jaxson Mansouri" }]
keywords = ["claude", "benchmark", "evaluation", "llm", "claude-code", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/Jaxsonman/Crucible"
Repository = "https://github.com/Jaxsonman/Crucible"
Issues = "https://github.com/Jaxsonman/Crucible/issues"

[project.scripts]
crucible = "crucible.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
